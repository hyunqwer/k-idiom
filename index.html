<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>말랑말랑 관용어 탐험대 - Level 1</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gamja+Flower&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <style>
        /* 기본 설정 */
        body {
            font-family: 'Jua', sans-serif;
            background-color: #f0f9ff;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }
        .font-hand { font-family: 'Gamja Flower', cursive; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 애니메이션 */
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px) rotate(-5deg); } 75% { transform: translateX(5px) rotate(5deg); } }
        .animate-shake { animation: shake 0.3s ease-in-out; }

        @keyframes sparkle { 0% { transform: scale(0) rotate(0deg); opacity: 0; } 50% { transform: scale(1.5) rotate(180deg); opacity: 1; } 100% { transform: scale(0) rotate(360deg); opacity: 0; } }
        .sparkle-effect::after {
            content: '✨'; position: absolute; top: -10px; right: -10px; font-size: 2rem;
            animation: sparkle 0.6s ease-out; pointer-events: none;
        }

        /* 매칭 게임 스타일 */
        .match-card {
            transition: all 0.2s;
            backface-visibility: hidden;
        }
        .match-card.selected {
            background-color: #fef08a; /* yellow-200 */
            border-color: #eab308; /* yellow-500 */
            transform: scale(1.05);
        }
        .match-card.matched {
            background-color: #dcfce7; /* green-100 */
            border-color: #22c55e; /* green-500 */
            color: #15803d; /* green-700 */
            opacity: 0.5;
            pointer-events: none;
            transform: scale(1);
        }

        /* 데미지 텍스트 애니메이션 (보스전) */
        @keyframes floatUpFade { 
            0% { opacity: 1; transform: translate(-50%, 0) scale(1); } 
            50% { transform: translate(-50%, -30px) scale(1.5); }
            100% { opacity: 0; transform: translate(-50%, -60px) scale(1); } 
        }
        .damage-text {
            position: absolute; left: 50%; top: 20%;
            color: #ef4444; font-weight: 900; font-size: 3rem;
            text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
            animation: floatUpFade 0.8s ease-out forwards;
            pointer-events: none; z-index: 50;
        }

        /* 3D 버튼 스타일 */
        .btn-3d { transition: all 0.1s; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
        .btn-3d:active { transform: translateY(4px); box-shadow: none; }
        .btn-3d.locked { background-color: #e5e7eb; color: #9ca3af; box-shadow: 0 4px 0 #d1d5db; pointer-events: none; }

        /* 힌트 버튼 */
        .hint-btn {
            background: linear-gradient(to bottom, #fef08a, #facc15);
            border: 2px solid #ca8a04;
            color: #854d0e;
        }

        /* 스테이지 버튼 */
        .stage-btn {
            width: 70px; height: 70px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; position: relative; z-index: 10;
        }
        
        /* 인트로 게이트 */
        #introView { position: absolute; inset: 0; z-index: 100; overflow: hidden; display: flex; }
        .gate-panel { flex: 1; height: 100%; background-color: #dbeafe; position: relative; transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1); z-index: 20; border-right: 1px solid #bfdbfe; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .gate-panel.right { border-left: 1px solid #bfdbfe; border-right: none; }
        #introView.open .gate-panel:first-child { transform: translateX(-100%); }
        #introView.open .gate-panel.right { transform: translateX(100%); }
        .intro-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 30; text-align: center; width: 100%; transition: opacity 0.5s ease-out; }
        #introView.open .intro-content { opacity: 0; pointer-events: none; }

        /* 채팅 말풍선 꼬리 */
        .chat-bubble-me::after { content: ''; position: absolute; right: -8px; bottom: 8px; border-width: 8px 0 8px 8px; border-color: transparent transparent transparent #fef01b; }
        .chat-bubble-you::after { content: ''; position: absolute; left: -8px; top: 8px; border-width: 8px 8px 8px 0; border-color: transparent white transparent transparent; }
    </style>
</head>
<body class="bg-blue-50 h-[100dvh] flex justify-center overflow-hidden">

    <div class="w-full max-w-md h-full bg-white shadow-2xl relative flex flex-col">

        <div id="introView">

<script>
    /**
     * SOUND MANAGER (Web Audio API)
     */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    const Sound = {
        play: (type) => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;

            if (type === 'correct') { // 딩동댕
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'wrong') { // 띠-
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'hit') { // 퍽!
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'chat') { // 톡!
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'pop') { // 팝
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            }
        }
    };

    /**
     * DATA: Spiral Learning Structure

                { type: "context_quiz", context: { text: "선생님이 중요한 시험 힌트를 주고 계세요.", media: "👩‍🏫" }, quiz: { prompt: "이럴 때 필요한 태도는?", choices: [{id:"c1", text:"귀를 기울이다"}, {id:"c2", text:"눈을 감다"}, {id:"c3", text:"귀가 얇다"}], answer:"c1" }, feedback: { correct: "맞아요! 집중해서 듣는 거예요.", incorrect: "'귀가 얇다'는 속는 것이고, '기울이다'는 듣는 거예요." } },
                { type: "emoji_detective", prompt: { text: "이모지를 보고 관용어를 완성하세요." }, interaction: { clues: ["👂", "➕", "📏", "➕", "🔊"], correct_sequence: ["귀를", "기울이다"], pool: ["귀를", "기울이다", "막다", "코를"] }, feedback: { correct: "정답!", incorrect: "몸을 기울여서 듣는 모습!" } },

    /**
     * STATE MANAGEMENT
     */
    let gameData = { xp: 50, hearts: 5, maxHearts: 5, completedLessons: [] }; 
    let currentLesson = null;
    let currentBlockIndex = 0;
    let bossInterval = null;

    // --- INIT ---
    function startApp() {
        Sound.play('pop');
        const intro = document.getElementById('introView');
        intro.classList.add('open');
        setTimeout(() => { intro.style.display = 'none'; }, 1000);
        
        loadGame();
        renderMap();
    }

    function loadGame() {
        const saved = localStorage.getItem('idiomLevel1_v4');
        if (saved) {
            const p = JSON.parse(saved);
            gameData = p;
        }
        updateTopBar();
    }

    function saveGame() {
        localStorage.setItem('idiomLevel1_v4', JSON.stringify(gameData));
        updateTopBar();
    }

    function updateTopBar() {
        document.getElementById('heartsDisplay').innerText = gameData.hearts;
        document.getElementById('xpDisplay').innerText = gameData.xp;
        document.getElementById('gameHearts').innerText = gameData.hearts;
    }

    /**
     * MAP RENDERER
     */
    function renderMap() {
        const container = document.getElementById('levelsContainer');
        container.innerHTML = '';

        LEVEL_1_DATA.forEach((lesson, idx) => {
            let isLocked = true;
            if (idx === 0) isLocked = false;
            else if (gameData.completedLessons.includes(LEVEL_1_DATA[idx-1].id)) isLocked = false;
            
            const isCompleted = gameData.completedLessons.includes(lesson.id);
            const isBoss = lesson.type === 'boss_raid';

            let justify = 'justify-center';
            if (!isBoss) justify = (idx % 2 === 0) ? 'justify-start pl-12' : 'justify-end pr-12';

            const row = document.createElement('div');
            row.className = `w-full max-w-xs flex ${justify}`;

            const btn = document.createElement('div');
            
            if (isBoss) {
                btn.className = `stage-btn btn-3d cursor-pointer border-4 border-white ${isLocked ? 'locked' : (isCompleted ? 'bg-yellow-500' : 'bg-purple-600 text-white animate-bounce')}`;
                btn.innerHTML = '☠️';
                if (!isLocked && !isCompleted) {
                    const bossTag = document.createElement('div');
                    bossTag.className="absolute -top-6 bg-red-600 text-white text-xs font-bold px-2 py-1 rounded-full animate-pulse";
                    bossTag.innerText="BOSS";
                    btn.appendChild(bossTag);
                }
            } else {
                btn.className = `stage-btn btn-3d cursor-pointer ${isLocked ? 'locked' : (isCompleted ? 'bg-yellow-400 text-white' : 'bg-green-500 text-white')}`;
                btn.innerHTML = isCompleted ? '⭐' : (isLocked ? '🔒' : (idx + 1));
            }

            const label = document.createElement('div');
            label.className = "absolute -bottom-8 w-32 text-center text-sm font-bold text-gray-600 bg-white/80 rounded-md py-1 backdrop-blur-sm pointer-events-none";
            label.innerText = lesson.title;
            btn.appendChild(label);

            if (!isLocked) {
                btn.onclick = () => { Sound.play('pop'); startLesson(lesson); };
            }

            row.appendChild(btn);
            container.appendChild(row);
        });
    }

    /**
     * GAME ENGINE
     */
    function startLesson(lesson) {
        if (gameData.hearts <= 0) { alert("하트가 부족해요! (자정 충전)"); return; }
        
        currentLesson = lesson;
        currentBlockIndex = 0;

        document.getElementById('mapView').classList.add('hidden');
        document.getElementById('gameView').classList.remove('hidden');
        document.getElementById('quizProgress').style.width = '0%';
        
        renderCurrentBlock();
    }

    function exitGame() {
        if (bossInterval) clearInterval(bossInterval);
        document.getElementById('gameView').classList.add('hidden');
        document.getElementById('mapView').classList.remove('hidden');
        renderMap();
    }

    function handleGameOver() {
        if(bossInterval) clearInterval(bossInterval); 
        
        alert("하트가 모두 소진되었어요! 💔\n하트를 충전하고 처음부터 다시 시작합니다! 🔥");
        
        // Recharge
        gameData.hearts = 5;
        updateTopBar();
        saveGame();

        // Reset to first block
        currentBlockIndex = 0;
        renderCurrentBlock();
    }

    function renderCurrentBlock() {
        const block = currentLesson.blocks[currentBlockIndex];
        const container = document.getElementById('blockContainer');
        const actionArea = document.getElementById('actionArea');
        const feedbackSec = document.getElementById('feedbackSection');
        const mainBtn = document.getElementById('mainActionBtn');

        container.innerHTML = '';
        feedbackSec.classList.add('hidden');
        actionArea.classList.remove('hidden');
        mainBtn.className = "btn-3d w-full py-4 rounded-2xl text-xl font-bold text-white bg-gray-300 pointer-events-none";
        mainBtn.innerText = "확인";
        mainBtn.onclick = null;

        // Block Routing
        if (block.type === 'concept_card') {
            renderConceptCard(container, block);
            actionArea.classList.add('hidden');
        } else if (block.type === 'boss_battle') {
            renderBossBattle(block);
        } else if (block.type === 'match_game') {
            renderMatchGame(container, block.interaction, (res) => processResult(res, block));
            actionArea.classList.add('hidden'); // Game auto-completes
        } else {
            if(block.prompt) {
                const title = document.createElement('h2');
                title.className = "text-2xl font-bold text-gray-700 mb-6 text-center whitespace-pre-line";
                title.innerText = block.prompt.text;
                container.appendChild(title);
            }

            if (block.type === 'context_quiz') renderContextQuiz(container, block);
            else if (block.type === 'chat_quiz') renderChatQuiz(container, block.interaction, (id) => checkAnswer(id, block.interaction.answer, block));
            else if (block.type === 'emoji_detective') renderEmojiDetective(container, block.interaction, (seq) => checkSentence(seq, block));
            else if (block.type === 'sentence_builder') renderSentenceBuilder(container, block.interaction, (seq) => checkSentence(seq, block));
        }

        const p = ((currentBlockIndex) / currentLesson.blocks.length) * 100;
        document.getElementById('quizProgress').style.width = `${p}%`;
    }

    /**
     * BLOCK RENDERERS
     */
    function renderConceptCard(container, block) {
        container.innerHTML = `
            <div class="w-full h-full flex flex-col items-center justify-center animate-pop cursor-pointer" onclick="Sound.play('pop'); nextBlock()">
                <div class="text-8xl mb-6 animate-float">${block.concept.media}</div>
                <h2 class="text-4xl font-black text-gray-800 mb-4 font-hand">${block.concept.word}</h2>
                <div class="bg-yellow-100 p-6 rounded-2xl border-4 border-yellow-300 text-center shadow-lg w-full max-w-sm">
                    <p class="text-2xl font-bold text-yellow-800 break-keep">${block.concept.meaning}</p>
                </div>
                <p class="mt-8 text-gray-400 font-bold animate-pulse">화면을 터치해서 시작하기 ▶</p>
            </div>
        `;
    }

    function renderMatchGame(container, interaction, cb) {
        const items = [];
        interaction.pairs.forEach((p, i) => {
            items.push({ id: i, text: p.word, type: 'L' });
            items.push({ id: i, text: p.mean, type: 'R' });
        });
        items.sort(() => Math.random() - 0.5);

        const grid = document.createElement('div');
        grid.className = "grid grid-cols-2 gap-4 w-full";
        
        let selected = null;
        let matchedCount = 0;

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = "match-card h-24 bg-white border-2 border-gray-200 rounded-xl flex items-center justify-center text-center font-bold text-gray-700 cursor-pointer shadow-sm p-2 text-sm";
            card.innerText = item.text;
            
            card.onclick = () => {
                if(card.classList.contains('matched') || card === selected) return;
                Sound.play('pop');

                if(!selected) {
                    selected = card;
                    card.classList.add('selected');
                } else {
                    const selItem = items.find(i => i.text === selected.innerText);
                    if(item.id === selItem.id && item.type !== selItem.type) {
                        // Match!
                        Sound.play('correct');
                        card.classList.add('matched');
                        selected.classList.remove('selected');
                        selected.classList.add('matched');
                        selected = null;
                        matchedCount++;
                        if(matchedCount === interaction.pairs.length) {
                            setTimeout(() => cb(true), 500);
                        }
                    } else {
                        // Fail
                        Sound.play('wrong');
                        card.classList.add('bg-red-100', 'animate-shake');
                        selected.classList.add('bg-red-100', 'animate-shake');
                        const tempSel = selected;
                        selected = null;
                        setTimeout(() => {
                            card.classList.remove('bg-red-100', 'animate-shake', 'selected');
                            tempSel.classList.remove('bg-red-100', 'animate-shake', 'selected');
                        }, 500);
                    }
                }
            };
            grid.appendChild(card);
        });
        container.appendChild(grid);
    }

        const ctxBox = document.createElement('div');
        ctxBox.className = "w-full bg-blue-50 p-6 rounded-2xl mb-6 flex flex-col items-center border-2 border-blue-100 shadow-sm";

        grid.className = "grid grid-cols-1 gap-3 w-full";

    function renderChatQuiz(container, interaction, cb) {
        Sound.play('chat');
        const chatBox = document.createElement('div');
        chatBox.className = "w-full bg-[#b2c7da] p-4 rounded-2xl mb-4 h-80 overflow-y-auto border-2 border-[#9bbbd4] flex flex-col space-y-4 shadow-inner";
        
        interaction.messages.forEach(msg => {
            const row = document.createElement('div');
            if (msg.is_me) {
                row.className = "flex w-full justify-end items-end";

            } else {
                row.className = "flex w-full justify-start items-start";
                row.innerHTML = `<div class="flex flex-col items-center mr-2"><div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-2xl shadow-sm border">${interaction.friend_avatar}</div><span class="text-xs text-gray-600 mt-1">${interaction.friend_name}</span></div>
                                 <div class="chat-bubble-you bg-white text-sm p-3 rounded-lg max-w-[70%] shadow-sm mt-2 relative font-medium">${msg.text}</div>`;

        });

        emptyRow.className = "flex w-full justify-end items-end";
        emptyRow.innerHTML = `<div id="chatPlaceholder" class="chat-bubble-me bg-[#fef01b] opacity-50 text-sm p-3 rounded-lg min-w-[100px] text-center text-gray-500 font-bold border-2 border-dashed border-gray-400 mr-2">?</div>`;

        optDiv.className = "w-full grid grid-cols-1 gap-2";

            btn.innerText = c.text;
            btn.onclick = () => {
                Sound.play('pop');
                document.querySelectorAll('.chat-opt').forEach(b => b.classList.remove('bg-yellow-100', 'border-yellow-400'));
                btn.classList.add('bg-yellow-100', 'border-yellow-400');

    function renderEmojiDetective(container, interaction, cb) {
        const hintWrap = document.createElement('div');
        hintWrap.className = "w-full flex justify-end mb-2";
        const hintBtn = document.createElement('button');
        hintBtn.className = "hint-btn btn-3d px-3 py-1 rounded-full text-sm font-bold shadow-md flex items-center";
        hintBtn.innerHTML = "💡 힌트 (-10 XP)";
        hintBtn.onclick = () => {
             if(gameData.xp >= 10) {
                 gameData.xp -= 10; updateTopBar(); Sound.play('pop');
                 alert(`첫 번째 글자는 '${interaction.correct_sequence[0]}' 입니다!`);
                 hintBtn.disabled = true; hintBtn.classList.add('opacity-50');
             } else {
                 alert("XP가 부족해요!");
             }
        };
        hintWrap.appendChild(hintBtn);
        container.appendChild(hintWrap);

        const clueBox = document.createElement('div');
        clueBox.className = "flex flex-wrap justify-center items-center gap-2 mb-8";
        interaction.clues.forEach((clue, idx) => {
            if(clue === "➕") {
                const plus = document.createElement('div'); plus.className="text-gray-400 font-bold"; plus.innerText="+"; clueBox.appendChild(plus);
            } else {
                const card = document.createElement('div');
                card.className = "w-16 h-20 bg-white border-4 border-purple-100 rounded-xl flex items-center justify-center text-4xl shadow-md animate-pop";
                card.style.animationDelay = `${idx * 0.1}s`;
                card.innerText = clue;
                clueBox.appendChild(card);
            }
        });
        container.appendChild(clueBox);

        let currentInput = [];
        const answerLen = interaction.correct_sequence.length;

        const disp = document.createElement('div');
        disp.className = "flex justify-center space-x-2 mb-8 min-h-[4rem]";
        const updateDisp = () => {
            disp.innerHTML = '';
            for(let i=0; i<answerLen; i++) {
                const box = document.createElement('div');
                const isFilled = currentInput[i] !== undefined;
                box.className = `min-w-[80px] px-3 h-14 border-b-4 flex items-center justify-center text-xl font-bold transition-all cursor-pointer whitespace-nowrap 
                    ${isFilled ? 'border-purple-500 text-purple-600 bg-purple-50 rounded-t-lg animate-pop' : 'border-gray-300 text-gray-300'}`;
                box.innerText = currentInput[i] || "";
                box.onclick = () => { if(isFilled){ currentInput.splice(i,1); updateDisp(); check(); Sound.play('pop'); } };
                disp.appendChild(box);
            }
        };
        container.appendChild(disp);
        updateDisp();

        const pool = document.createElement('div');
        pool.className = "flex flex-wrap justify-center gap-3";
        const shuffled = [...interaction.pool].sort(() => Math.random() - 0.5);
        shuffled.forEach(token => {
            const chip = document.createElement('button');
            chip.className = "px-4 py-2 bg-white border-2 border-gray-200 rounded-xl text-lg font-bold text-gray-700 shadow-[0_4px_0_#e5e7eb] active:shadow-none active:translate-y-1 transition-all hover:bg-gray-50";
            chip.innerText = token;
            chip.onclick = () => {
                Sound.play('pop');
                if(currentInput.length < answerLen) {
                    currentInput.push(token);
                    updateDisp();
                    check();
                }
            };
            pool.appendChild(chip);
        });
        container.appendChild(pool);

        function check() {
            if(currentInput.length === answerLen) enableMainBtn("정답 확인 🔍", () => cb(currentInput));
            else disableMainBtn();
        }
    }

    function renderSentenceBuilder(container, interaction, cb) {
        const ansArea = document.createElement('div');
        ansArea.className="w-full min-h-[80px] border-b-2 border-gray-300 mb-8 flex flex-wrap gap-2 justify-center pb-4 pt-4";
        const poolArea = document.createElement('div');
        poolArea.className="flex flex-wrap gap-2 justify-center";
        
        let seq = [];
        const update = () => {
            if(seq.length > 0) enableMainBtn("완성!", () => cb(seq));
            else disableMainBtn();
        }

        const shuffledTokens = [...interaction.tokens].sort(() => Math.random() - 0.5);
        shuffledTokens.forEach(t => {
            const b = document.createElement('button');
            b.className="bg-white border-2 border-gray-200 rounded-xl px-4 py-2 font-bold text-gray-700 shadow-sm active:translate-y-1 transition-all";
            b.innerText=t;
            b.onclick=()=>{
                Sound.play('pop');
                if(b.parentElement === poolArea) {
                    ansArea.appendChild(b);
                    seq.push(t);
                    b.classList.add('border-blue-400', 'text-blue-600', 'bg-blue-50');
                } else {
                    poolArea.appendChild(b);
                    seq = seq.filter(x=>x!==t);
                    b.classList.remove('border-blue-400', 'text-blue-600', 'bg-blue-50');
                }
                update();
            };
            poolArea.appendChild(b);
        });
        container.appendChild(ansArea);
        container.appendChild(poolArea);
    }

    function renderBossBattle(block) {
        const container = document.getElementById('blockContainer');
        const actionArea = document.getElementById('actionArea');
        actionArea.classList.add('hidden'); 

        let currentQIdx = 0;
        let currentHP = block.boss.max_hp;
        const damagePerHit = block.boss.max_hp / block.questions.length;
        let timeLeft = block.boss.time_per_turn;

        container.innerHTML = '';

        const hintWrap = document.createElement('div');
        hintWrap.className = "w-full flex justify-end mb-2 absolute top-2 right-4 z-10";
        const hintBtn = document.createElement('button');
        hintBtn.className = "hint-btn btn-3d px-3 py-1 rounded-full text-sm font-bold shadow-md flex items-center";
        hintBtn.innerHTML = "💡 오답 지우기 (-10 XP)";
        hintBtn.onclick = () => {
             if(gameData.xp >= 10) {
                 gameData.xp -= 10; updateTopBar(); Sound.play('pop');
                 const btns = document.querySelectorAll('#bossOptions button');
                 const q = block.questions[currentQIdx];
                 let removed = false;
                 btns.forEach(b => {
                     if(removed) return;
                     const txt = b.innerText;
                     let isCorrect = (q.type === 'ox' && ((q.a==='false' && txt.includes('아니야')) || (q.a==='true' && txt.includes('맞아')))) || txt === q.a;
                     if(!isCorrect) {
                         b.style.opacity = '0.1'; b.disabled = true; removed = true;
                     }
                 });
                 hintBtn.disabled = true; hintBtn.classList.add('opacity-50');
             } else {
                 alert("XP가 부족해요!");
             }
        };
        container.appendChild(hintWrap);

        const bossUI = document.createElement('div');
        bossUI.className = "w-full flex flex-col items-center mb-4 relative";
        bossUI.innerHTML = `
            <div class="w-full bg-gray-200 rounded-full h-6 mb-4 border-2 border-gray-400 relative overflow-hidden">
                <div id="bossHPBar" class="bg-purple-600 h-full transition-all duration-500" style="width: 100%"></div>
                <span class="absolute inset-0 flex items-center justify-center text-xs font-bold text-white shadow-sm">안개마왕 HP</span>
            </div>
            <div id="bossAvatar" class="text-8xl animate-float filter drop-shadow-xl transition-transform cursor-pointer select-none">${block.boss.image}</div>
            <h2 class="text-xl font-bold text-gray-700 mt-2">${block.boss.name}</h2>
            <div id="damageContainer" class="absolute inset-0 pointer-events-none"></div>
        `;
        container.appendChild(bossUI);

        const gameArea = document.createElement('div');
        gameArea.className = "w-full flex-1 flex flex-col items-center justify-start mt-4";
        gameArea.innerHTML = `
            <div class="w-full h-3 bg-gray-200 rounded-full mb-6 overflow-hidden">
                <div id="turnTimer" class="h-full bg-red-500 transition-all duration-100 ease-linear" style="width: 100%"></div>
            </div>
            <div id="bossQText" class="text-2xl font-black text-center text-gray-800 break-keep mb-8 min-h-[4rem] flex items-center justify-center animate-pop"></div>
            <div id="bossOptions" class="grid grid-cols-1 gap-3 w-full"></div>
        `;
        container.appendChild(gameArea);

        function loadQ() {
            if (currentQIdx >= block.questions.length) { win(); return; }
            const q = block.questions[currentQIdx];
            document.getElementById('bossQText').innerText = q.q;
            
            hintBtn.disabled = false; hintBtn.classList.remove('opacity-50');
            
            const grid = document.getElementById('bossOptions');
            grid.innerHTML = '';
            
            const opts = [...q.options].sort(()=>Math.random()-0.5);
            opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "btn-3d w-full py-4 bg-white border-b-4 border-gray-300 rounded-xl text-xl font-bold text-gray-700 active:border-b-0 active:translate-y-1 active:bg-gray-100 transition-all shadow-sm";
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(opt, q);
                grid.appendChild(btn);
            });

            timeLeft = block.boss.time_per_turn;
            if(bossInterval) clearInterval(bossInterval);
            bossInterval = setInterval(() => {
                timeLeft -= 0.1;
                document.getElementById('turnTimer').style.width = `${(timeLeft/block.boss.time_per_turn)*100}%`;
                if(timeLeft <= 0) {
                    clearInterval(bossInterval);
                    playerHit("시간 초과!");
                }
            }, 100);
        }

        function handleAnswer(sel, q) {
            clearInterval(bossInterval);
            let isCorrect = false;
            if (q.type === 'ox') {
                if (q.a === 'false' && sel.includes('아니야')) isCorrect = true;
                if (q.a === 'true' && sel.includes('맞아')) isCorrect = true;
            } else {
                isCorrect = sel === q.a;
            }

            if(isCorrect) bossHit();
            else playerHit("틀렸어요!");
        }

        function bossHit() {
            Sound.play('hit'); 
            currentHP -= damagePerHit;
            if(currentHP < 0) currentHP = 0;
            document.getElementById('bossHPBar').style.width = `${(currentHP/block.boss.max_hp)*100}%`;
            
            const avatar = document.getElementById('bossAvatar');
            avatar.classList.add('animate-shake', 'text-red-500');
            avatar.innerText = "😖";

            const dmgText = document.createElement('div');
            dmgText.className = "damage-text";
            dmgText.innerText = `-${Math.floor(damagePerHit)}`;
            document.getElementById('damageContainer').appendChild(dmgText);
            setTimeout(() => dmgText.remove(), 800);
            
            setTimeout(() => {
                avatar.classList.remove('animate-shake', 'text-red-500');
                avatar.innerText = block.boss.image;
                currentQIdx++;
                loadQ();
            }, 600);
        }

        function playerHit(msg) {
            Sound.play('wrong'); 
            gameData.hearts--;
            updateTopBar();
            const view = document.getElementById('gameView');
            view.classList.add('animate-shake', 'bg-red-50');
            setTimeout(() => view.classList.remove('animate-shake', 'bg-red-50'), 400);

            if(gameData.hearts <= 0) {
                handleGameOver();
                return;
            } else {
                currentQIdx++;
                loadQ();
            }
        }

        function win() {
            if(currentHP <= 10) {
                finishLesson(true);
            } else {
                alert("마왕이 도망쳤어요! (정답을 더 많이 맞춰야 해요)");
                exitGame();
            }
        }

        loadQ();
    }

    /**
     * LOGIC UTILS
     */
    function enableMainBtn(txt, cb) {
        const btn = document.getElementById('mainActionBtn');
        btn.innerText = txt;
        btn.className = "btn-3d w-full py-4 rounded-2xl text-xl font-bold text-white bg-green-500 hover:bg-green-600 shadow-[0_4px_0_#15803d]";
        btn.onclick = cb;
        btn.style.pointerEvents = "auto";
    }

    function disableMainBtn() {
        const btn = document.getElementById('mainActionBtn');
        btn.className = "btn-3d w-full py-4 rounded-2xl text-xl font-bold text-white bg-gray-300 pointer-events-none";
        btn.onclick = null;
    }

    function checkAnswer(userAnswer, correctAnswer, block) {
        const isCorrect = userAnswer === correctAnswer;
        processResult(isCorrect, block);
    }

    function checkSentence(seq, block) {
        const isCorrect = JSON.stringify(seq) === JSON.stringify(block.interaction.correct_sequence);
        processResult(isCorrect, block);
    }

    function processResult(isCorrect, block) {
        const fbSec = document.getElementById('feedbackSection');
        const fbTitle = document.getElementById('feedbackTitle');
        const fbText = document.getElementById('feedbackText');
        const fbIcon = document.getElementById('feedbackIcon');
        const btn = document.getElementById('mainActionBtn');
        const actionArea = document.getElementById('actionArea'); // Bugfix: Re-select area

        actionArea.classList.remove('hidden'); // Ensure visible
        fbSec.classList.remove('hidden');
        
        if (isCorrect) {
            Sound.play('correct'); 
            fbSec.className = "mb-4 p-4 rounded-xl flex items-start space-x-3 animate-pop bg-green-100 text-green-800 border border-green-200 sparkle-effect relative";
            fbIcon.innerText = "✅";
            fbTitle.innerText = "정답! 🎉";
            fbText.innerText = block.feedback.correct;
            
            btn.innerText = "계속하기";
            btn.className = "btn-3d w-full py-4 rounded-2xl text-xl font-bold text-white bg-green-500 hover:bg-green-600 shadow-[0_4px_0_#15803d]"; // Re-apply green style
            btn.onclick = nextBlock;
        } else {
            Sound.play('wrong'); 
            gameData.hearts--;
            updateTopBar();
            if(gameData.hearts <= 0) { 
                handleGameOver();
                return; 
            }

            fbSec.className = "mb-4 p-4 rounded-xl flex items-start space-x-3 animate-shake bg-red-100 text-red-800 border border-red-200";
            fbIcon.innerText = "❌";
            fbTitle.innerText = "아쉬워요!";
            fbText.innerText = block.feedback.incorrect;

            btn.innerText = "계속하기";
            btn.className = "btn-3d w-full py-4 rounded-2xl text-xl font-bold text-white bg-red-500 hover:bg-red-600 shadow-[0_4px_0_#991b1b]";
            btn.onclick = nextBlock;
        }
    }

    function nextBlock() {
        currentBlockIndex++;
        if (currentBlockIndex < currentLesson.blocks.length) {
            renderCurrentBlock();
        } else {
            finishLesson();
        }
    }

    function finishLesson(isBoss = false) {
        Sound.play('correct');
        if (!gameData.completedLessons.includes(currentLesson.id)) {
            gameData.completedLessons.push(currentLesson.id);
            gameData.xp += (isBoss ? 50 : 20);
            saveGame();
        }
        
        document.getElementById('modalTitle').innerText = isBoss ? "마왕 퇴치 성공!" : "레슨 완료!";
        document.getElementById('modalXP').innerText = isBoss ? "+50" : "+20";
        document.getElementById('completeModal').classList.remove('hidden');
    }

    function closeCompleteModal() {
        document.getElementById('completeModal').classList.add('hidden');
        exitGame();
    }

</script>
</body>
