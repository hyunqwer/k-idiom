<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>말랑말랑 관용어 탐험대</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gamja+Flower&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background-color: #f0f9ff;
            user-select: none;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }
        .font-hand { font-family: 'Gamja Flower', cursive; }
        .font-pen { font-family: 'Nanum Pen Script', cursive; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animations */
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }

        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.4s ease-out forwards; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .animate-shake { animation: shake 0.2s ease-in-out 3; }

        @keyframes comboPop { 0% { transform: scale(0.5) rotate(-10deg); opacity: 0; } 50% { transform: scale(1.2) rotate(10deg); opacity: 1; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
        .combo-effect { animation: comboPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* Stage Button */
        .stage-btn {
            width: 70px; height: 70px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s, box-shadow 0.1s;
            position: relative; z-index: 10;
        }
        .stage-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
        .stage-btn.locked { background-color: #e5e7eb; color: #9ca3af; box-shadow: 0 4px 0 #d1d5db; }
        .stage-btn.completed { background-color: #fbbf24; color: white; box-shadow: 0 6px 0 #d97706; }
        .stage-btn.current { background-color: #58cc02; color: white; box-shadow: 0 6px 0 #46a302; }
        
        /* Checkpoint / Cave Style */
        .stage-btn.checkpoint { border: 4px solid #fff; }
        .stage-btn.checkpoint.current { background-color: #ef4444; box-shadow: 0 6px 0 #b91c1c; }
        .stage-btn.checkpoint.completed { background-color: #f59e0b; box-shadow: 0 6px 0 #b45309; }
        
        .stage-btn.cave { border: 4px solid #9333ea; }
        .stage-btn.cave.current { background-color: #a855f7; box-shadow: 0 6px 0 #7e22ce; }
        .stage-btn.cave.completed { background-color: #c084fc; box-shadow: 0 6px 0 #9333ea; }

        /* Token for Sentence Builder */
        .word-token {
            background: white; border: 2px solid #e5e7eb; border-radius: 12px;
            padding: 8px 16px; font-size: 18px; color: #374151;
            box-shadow: 0 3px 0 #e5e7eb; margin: 4px; cursor: pointer;
            transition: all 0.2s;
        }
        .word-token:active { transform: translateY(2px); box-shadow: 0 1px 0 #e5e7eb; }
        
        /* INTRO & GATE STYLES */
        #introView { position: absolute; inset: 0; z-index: 100; overflow: hidden; display: flex; }
        .gate-panel {
            flex: 1; height: 100%; background-color: #dbeafe;
            position: relative; transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 20; border-right: 1px solid #bfdbfe;
        }
        .gate-panel.right { border-left: 1px solid #bfdbfe; border-right: none; }
        #introView.open .gate-panel:first-child { transform: translateX(-100%); }
        #introView.open .gate-panel.right { transform: translateX(100%); }
        .intro-content {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 30; text-align: center; width: 100%; transition: opacity 0.5s ease-out;
        }
        #introView.open .intro-content { opacity: 0; pointer-events: none; }
        .cloud-deco { position: absolute; font-size: 4rem; opacity: 0.6; animation: float 4s ease-in-out infinite; }
        .title-word { display: inline-block; animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; opacity: 0; }
    </style>
</head>
<body class="bg-blue-50 h-screen flex justify-center overflow-hidden">

    <div class="w-full max-w-md h-full bg-white shadow-2xl relative flex flex-col">
        
        <!-- INTRO VIEW -->
        <div id="introView">
            <div class="gate-panel">
                <div class="cloud-deco" style="top: 15%; left: 15%; animation-delay: 0s;">☁️</div>
                <div class="cloud-deco" style="bottom: 25%; right: 20%; animation-delay: 1s; font-size: 3rem;">🎈</div>
                <div class="cloud-deco" style="bottom: 10%; left: 10%; animation-delay: 2s; font-size: 5rem;">🌳</div>
            </div>
            <div class="gate-panel right">
                <div class="cloud-deco" style="top: 20%; right: 10%; animation-delay: 0.5s;">☁️</div>
                <div class="cloud-deco" style="top: 40%; left: 10%; animation-delay: 1.5s; font-size: 2.5rem;">✨</div>
                <div class="cloud-deco" style="bottom: 15%; right: 15%; animation-delay: 2.5s; font-size: 4rem;">🌷</div>
            </div>
            <div class="intro-content">
                <h1 class="flex flex-col items-center mb-10">
                    <span class="text-6xl font-black text-blue-500 drop-shadow-md mb-3 title-word font-hand" style="animation-delay: 0.1s">말랑말랑</span>
                    <span class="text-5xl font-bold text-gray-700 drop-shadow-sm title-word" style="animation-delay: 0.3s">관용어 탐험대</span>
                </h1>
                <div class="title-word" style="animation-delay: 0.6s">
                    <button onclick="startExploration()" class="bg-green-500 hover:bg-green-600 text-white text-2xl font-bold py-5 px-12 rounded-full shadow-[0_6px_0_#15803d] active:translate-y-2 active:shadow-none transition-all animate-bounce">
                        탐험 시작! 🚀
                    </button>
                </div>
            </div>
        </div>

        <!-- Header -->
        <header class="h-16 bg-white border-b-2 border-gray-100 flex items-center justify-between px-4 z-20 shrink-0">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">❤️</span>
                <span id="heartsDisplay" class="text-xl font-bold text-red-500">5</span>
            </div>
            <h1 class="text-xl font-bold text-gray-700">말랑말랑 관용어</h1>
            <div class="flex items-center space-x-2">
                <span class="text-xl font-bold text-yellow-500" id="xpDisplay">0</span>
                <span class="text-sm font-bold text-gray-400">XP</span>
            </div>
        </header>

        <!-- Map View -->
        <main id="mapView" class="flex-1 overflow-y-auto no-scrollbar relative bg-[#dcfce7] p-6 pb-32">
            <div class="absolute top-10 left-10 text-4xl opacity-20 animate-float fixed">☁️</div>
            <div class="absolute top-40 right-10 text-5xl opacity-20 fixed">🌳</div>
            
            <div id="levelsContainer" class="flex flex-col items-center space-y-8 pt-6 pb-20">
                <!-- Dynamic Content -->
            </div>
            
            <!-- Dictionary Float Button -->
            <button onclick="openDictionary()" class="fixed bottom-6 right-[calc(50%-180px)] md:right-auto md:ml-[340px] bg-white border-2 border-gray-200 text-gray-700 w-16 h-16 rounded-full shadow-lg flex items-center justify-center text-3xl hover:bg-gray-50 active:translate-y-1 active:shadow-md transition-all z-40">
                📖
            </button>
        </main>

        <!-- Dictionary View -->
        <div id="dictView" class="hidden absolute inset-0 bg-gray-50 z-50 flex flex-col">
            <header class="h-16 bg-white border-b-2 border-gray-200 flex items-center px-4 shrink-0 shadow-sm relative">
                <button onclick="closeDictionary()" class="text-gray-400 text-3xl hover:text-gray-600 absolute left-4">←</button>
                <h1 class="text-xl font-bold text-gray-700 w-full text-center">내 관용어 사전</h1>
            </header>
            <div id="dictContent" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Idiom Cards injected here -->
            </div>
        </div>

        <!-- Game View -->
        <div id="gameView" class="hidden absolute inset-0 bg-white z-50 flex flex-col">
            <!-- Game Header -->
            <div class="h-16 flex items-center justify-between px-4 shrink-0 bg-white border-b-2 border-gray-100">
                <button onclick="exitGame()" class="text-gray-400 text-2xl hover:text-gray-600">✕</button>
                <div class="flex-1 mx-4">
                    <div class="w-full h-4 bg-gray-200 rounded-full overflow-hidden relative">
                        <div id="quizProgress" class="h-full bg-green-500 transition-all duration-300" style="width: 0%"></div>
                        <div id="timerBar" class="hidden h-full bg-red-500 transition-all duration-1000 ease-linear" style="width: 100%"></div>
                    </div>
                </div>
                <div class="flex items-center">
                    <span id="headerRightIcon" class="text-red-500 text-xl mr-1">❤️</span>
                    <span id="gameHearts" class="font-bold text-gray-700">5</span>
                </div>
            </div>

            <!-- Combo Overlay -->
            <div id="comboOverlay" class="hidden absolute top-20 left-1/2 transform -translate-x-1/2 z-50 pointer-events-none">
                <div class="text-4xl font-black text-yellow-500 drop-shadow-lg combo-effect" id="comboText">Combo x2!</div>
                <div class="text-xl font-bold text-green-500 text-center drop-shadow-md mt-1" id="timeBonusText">+3초</div>
            </div>

            <!-- Block Content Area -->
            <div id="blockContainer" class="flex-1 overflow-y-auto p-6 flex flex-col items-center max-w-full relative">
                <!-- Dynamic Block -->
            </div>

            <!-- Bottom Action Area -->
            <div id="actionArea" class="p-4 border-t-2 border-gray-100 bg-white shrink-0">
                <div id="feedbackSection" class="hidden mb-4 p-4 rounded-xl flex items-start space-x-3 animate-slide-in">
                    <div id="feedbackIcon" class="text-3xl"></div>
                    <div>
                        <h3 id="feedbackTitle" class="text-lg font-bold"></h3>
                        <p id="feedbackText" class="text-sm text-gray-700 mt-1"></p>
                    </div>
                </div>
                
                <button id="mainActionBtn" class="w-full py-4 rounded-2xl text-xl font-bold text-white shadow-[0_4px_0_rgba(0,0,0,0.2)] active:shadow-none active:translate-y-1 transition-all bg-gray-300 pointer-events-none">
                    확인
                </button>
            </div>
        </div>

        <!-- Complete Modal -->
        <div id="completeModal" class="hidden absolute inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white rounded-3xl p-8 text-center w-full max-w-sm animate-pop border-4 border-yellow-400">
                <div id="modalIcon" class="text-7xl mb-4 animate-bounce">🎉</div>
                <h2 id="modalTitle" class="text-3xl font-bold text-gray-800 mb-2">레슨 완료!</h2>
                <p id="modalDesc" class="text-gray-500 mb-8 text-lg">실력이 쑥쑥 자랐어요!</p>
                <div class="flex justify-center mb-8">
                    <div class="bg-yellow-50 px-6 py-3 rounded-2xl border-2 border-yellow-200">
                        <div class="text-sm text-yellow-600 font-bold uppercase tracking-wide">XP 획득</div>
                        <div id="modalXP" class="text-3xl font-bold text-yellow-500">+20</div>
                    </div>
                </div>
                <button onclick="closeCompleteModal()" class="w-full bg-green-500 hover:bg-green-600 text-white py-4 rounded-2xl font-bold text-xl shadow-[0_4px_0_#15803d]">
                    계속하기
                </button>
            </div>
        </div>

        <!-- Fail Modal -->
        <div id="failModal" class="hidden absolute inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white rounded-3xl p-8 text-center w-full max-w-sm animate-pop border-4 border-red-400">
                <div class="text-7xl mb-4">⏰</div>
                <h2 class="text-3xl font-bold text-gray-800 mb-2">시간 초과!</h2>
                <p class="text-gray-500 mb-8 text-lg">조금만 더 빠르면 할 수 있어요!</p>
                <button onclick="retryTimeAttack()" class="w-full bg-red-500 hover:bg-red-600 text-white py-4 rounded-2xl font-bold text-xl shadow-[0_4px_0_#991b1b]">
                    다시 도전하기
                </button>
            </div>
        </div>
    </div>

<script>
    /**
     * Data & Logic
     */
    
    // 복습 데이터 (타임어택 및 사전용 글로벌 풀)

            { "type": "context_quiz", "context": { "text": "발표 시간인데 망설이던 민지가 드디어 말을 시작했어요.", "media": "🗣️" }, "quiz": { "prompt": "말하기를 시작할 때 쓰는 말은?", "choices": [{ "id": "c1", "text": "입을 열다" }, { "id": "c2", "text": "입을 다물다" }], "correct_choice_ids": ["c1"] }, "feedback": { "correct": "맞아요! ‘입을 열다’는 말하기를 시작한다는 뜻이에요.", "incorrect": "드디어 말을 시작했어요." } }

    function generateBlocksForIdiom(idiom) {
        return [
            {
                type: "context_quiz",
                context: { text: idiom.ex.replace(idiom.q, "______"), media: "🤔" },
                quiz: { 
                    prompt: `'${idiom.q}'의 뜻은?`,
                    choices: [
                        { id: "c1", text: idiom.m },
                        { id: "c2", text: "반대되는 뜻" },
                        { id: "c3", text: "다른 뜻" }
                    ].sort(()=>Math.random()-0.5),
                    correct_choice_ids: ["c1"]
                },
                feedback: { correct: "정답!", incorrect: `정답은 '${idiom.m}' 입니다.` }
            },
            {
                type: "sentence_builder",
                prompt: { text: "문장을 올바르게 배열하세요." },
                interaction: {
                    tokens: idiom.ex.split(" ").sort(()=>Math.random()-0.5),
                    correct_sequence: idiom.ex.split(" ")
                },
                feedback: { correct: "완벽해요!", incorrect: "순서를 확인하세요." }
            }
        ];
    }

    // --- MAP ---
    function renderMap() {
        const container = document.getElementById('levelsContainer');
        container.innerHTML = '';
        
        let normalLevelCount = 0; // To properly assign colors to normal levels ignoring caves

        gameData.levels.forEach((level, lIdx) => {
            const header = document.createElement('div');
            header.className = "w-full max-w-xs text-center mb-6 mt-4 relative z-10";
            
            let hStyle = '';
            if (level.type === 'cave') {
                hStyle = 'bg-purple-700 shadow-purple-900 border-2 border-purple-400';
            } else {
                hStyle = LEVEL_THEMES[normalLevelCount]?.color || 'bg-gray-500';
                normalLevelCount++;
            }
            
            header.innerHTML = `<div class="inline-block px-5 py-2 rounded-2xl text-white font-bold text-lg shadow-md ${hStyle}">${level.title}</div>`;
            container.appendChild(header);

            level.lessons.forEach((lesson, sIdx) => {
                const isCompleted = gameData.completedLessons.includes(lesson.lesson_id);
                let isLocked = true;
                
                if (lIdx === 0 && sIdx === 0) isLocked = false;
                else {
                    if(sIdx > 0) {
                        const prevId = level.lessons[sIdx-1].lesson_id;
                        if(gameData.completedLessons.includes(prevId)) isLocked = false;
                    } else if (lIdx > 0) {
                        const prevLevel = gameData.levels[lIdx-1];
                        const lastLessonOfPrev = prevLevel.lessons[prevLevel.lessons.length-1].lesson_id;
                        if(gameData.completedLessons.includes(lastLessonOfPrev)) isLocked = false;
                    }
                }

                let align = 'justify-center';
                if (lesson.type !== 'checkpoint') {
                    if (sIdx % 2 !== 0) align = (sIdx % 4 === 1) ? 'justify-start pl-12' : 'justify-end pr-12';
                }

                const row = document.createElement('div');
                row.className = `w-full max-w-xs flex ${align} mb-6 z-10 relative`;
                
                const btn = document.createElement('div');
                let statusClass = isLocked ? 'locked' : (isCompleted ? 'completed' : 'current');
                
                if (lesson.type === 'checkpoint') {
                    btn.className = `stage-btn checkpoint cursor-pointer ${statusClass}`;
                    if(!isLocked) btn.classList.add(isCompleted ? 'bg-yellow-500' : 'bg-red-500');
                    btn.innerHTML = '🏆';
                } else if (level.type === 'cave') {
                    btn.className = `stage-btn cave cursor-pointer ${statusClass}`;
                    btn.innerHTML = isCompleted ? '✨' : (isLocked ? '🔒' : '🔮');
                } else {
                    btn.className = `stage-btn cursor-pointer ${statusClass}`;
                    if(!isLocked) {
                        // Use normalLevelCount - 1 because it already incremented for this level group
                        const colorHex = getTailwindColor(LEVEL_THEMES[normalLevelCount - 1]?.color);
                        btn.style.backgroundColor = isCompleted ? '#fbbf24' : colorHex;
                    }
                    btn.innerHTML = isCompleted ? '⭐' : (isLocked ? '🔒' : '★');
                }

                const label = document.createElement('div');
                label.className = "absolute -bottom-8 w-32 text-center text-sm font-bold text-gray-600 bg-white/80 rounded-md py-1 backdrop-blur-sm pointer-events-none";
                label.innerText = lesson.title;
                btn.appendChild(label);

                if(!isLocked) {
                    btn.onclick = () => startLesson(level, lesson, lIdx);
                }
                row.appendChild(btn);
                container.appendChild(row);
            });
        });
    }

    function getTailwindColor(cls) {
        if(!cls) return '#58cc02';
        if(cls.includes('green')) return '#22c55e';
        if(cls.includes('blue')) return '#3b82f6';
        if(cls.includes('pink')) return '#ec4899';
        if(cls.includes('purple')) return '#a855f7';
        if(cls.includes('orange')) return '#f97316';
        if(cls.includes('teal')) return '#14b8a6';
        if(cls.includes('rose')) return '#f43f5e';
        if(cls.includes('indigo')) return '#6366f1';
        if(cls.includes('cyan')) return '#06b6d4';
        if(cls.includes('yellow')) return '#eab308';
        return '#58cc02';
    }

    // --- GAME ENGINE ---
    function startLesson(level, lesson, levelIndex) {
        if (lesson.type === 'checkpoint') {
            initTimeAttack(level, lesson);
        } else {
            if(gameData.hearts <= 0) { alert("하트 부족! 조금 쉬었다 해요."); return; }
            startNormalLesson(level, lesson);
        }
    }

    function exitGame() {
        stopTimer();
        document.getElementById('gameView').classList.add('hidden');
        document.getElementById('mapView').classList.remove('hidden');
        renderMap();
    }

    function startNormalLesson(level, lesson) {
        isTimeAttackMode = false;
        currentLesson = lesson;
        currentBlockIndex = 0;
        
        document.getElementById('quizProgress').classList.remove('hidden');
        document.getElementById('quizProgress').style.width = '0%';
        document.getElementById('timerBar').classList.add('hidden');
        document.getElementById('headerRightIcon').innerText = '❤️';
        document.getElementById('gameHearts').innerText = gameData.hearts;
        
        document.getElementById('mapView').classList.add('hidden');
        document.getElementById('gameView').classList.remove('hidden');

        renderCurrentBlock();
    }

    function renderCurrentBlock() {
        let block = currentLesson.blocks[currentBlockIndex];
        
        const container = document.getElementById('blockContainer');
        const actionArea = document.getElementById('actionArea');
        const mainBtn = document.getElementById('mainActionBtn');
        const feedbackSec = document.getElementById('feedbackSection');

        container.innerHTML = '';
        feedbackSec.classList.add('hidden');
        actionArea.classList.remove('hidden');
        
        mainBtn.className = "w-full py-4 rounded-2xl text-xl font-bold text-white shadow-[0_4px_0_rgba(0,0,0,0.2)] bg-gray-300 pointer-events-none";
        mainBtn.innerText = "확인";
        mainBtn.onclick = null;

        if (block.type !== 'context_quiz') {
             const title = document.createElement('h2');
             title.className = "text-2xl font-bold text-gray-700 mb-6 text-center whitespace-pre-line";
             title.innerText = block.prompt.text;
             container.appendChild(title);
        }

        const i = block.interaction;

        if (block.type === 'context_quiz') {
            const ctxContainer = document.createElement('div');
            ctxContainer.className = "w-full bg-blue-50 p-6 rounded-2xl mb-6 flex flex-col items-center border-2 border-blue-100";
            
            if(block.context.media) {
                const mediaEl = document.createElement('div');
                mediaEl.className = "text-6xl mb-4 animate-bounce";
                mediaEl.innerText = block.context.media;
                ctxContainer.appendChild(mediaEl);
            }
            const ctxText = document.createElement('div');
            ctxText.className = "text-lg text-gray-700 font-medium text-center break-keep";
            ctxText.innerText = block.context.text;
            ctxContainer.appendChild(ctxText);
            container.appendChild(ctxContainer);

            const qTitle = document.createElement('h2');
            qTitle.className = "text-xl font-bold text-gray-800 mb-4 text-center";
            qTitle.innerText = block.quiz.prompt;
            container.appendChild(qTitle);

            renderMCQ(container, block.quiz.choices, (id) => checkAnswer(id, block.quiz.correct_choice_ids, block));
        } else if (block.type === 'mcq' || block.type === 'cloze') {
            renderMCQ(container, i.choices, (id) => checkAnswer(id, i.correct_choice_ids, block));
        } else if (block.type === 'true_false') {
            renderTF(container, (id) => checkAnswer(id, i.correct_choice_ids, block));
        } else if (block.type === 'sentence_builder') {
            renderSB(container, i.tokens, (seq) => checkSentence(seq, i.correct_sequence, block));
        }
        
        const p = ((currentBlockIndex) / currentLesson.blocks.length) * 100;
        document.getElementById('quizProgress').style.width = `${p}%`;
    }

    // --- TIME ATTACK MODE ---
    function initTimeAttack(level, lesson) {
        isTimeAttackMode = true;
        currentLesson = lesson;
        taTimeLeft = 60;
        taCombo = 0;
        taCurrentQIndex = 0;
        
        // Grab learned idioms from the entire level
        let pool = [];
        level.lessons.forEach(l => {
            if(l.type !== 'checkpoint' && GLOBAL_IDIOM_POOL[l.title]) {
                pool.push({ q: l.title, m: GLOBAL_IDIOM_POOL[l.title].m });
            }
        });
        
        taQuestions = [];
        for(let i=0; i<taTotalQ; i++) {
            let item = pool[i % pool.length]; 
            taQuestions.push({
                item: item,
                choices: [
                    item.m,
                    "전혀 다른 의미입니다.", 
                    "반대되는 의미입니다." 
                ].sort(() => Math.random() - 0.5)
            });
        }

        document.getElementById('mapView').classList.add('hidden');
        document.getElementById('gameView').classList.remove('hidden');
        
        document.getElementById('quizProgress').classList.add('hidden');
        document.getElementById('timerBar').classList.remove('hidden');
        document.getElementById('timerBar').style.width = '100%';
        document.getElementById('headerRightIcon').innerText = '🔥';
        document.getElementById('gameHearts').innerText = '0';

        startTimer();
        renderTimeAttackQuestion();
    }

    function startTimer() {
        if(taTimerInterval) clearInterval(taTimerInterval);
        taTimerInterval = setInterval(() => {
            taTimeLeft--;
            const width = (taTimeLeft / 60) * 100;
            const bar = document.getElementById('timerBar');
            bar.style.width = `${width}%`;
            
            if(taTimeLeft <= 10) bar.classList.replace('bg-green-500', 'bg-red-500');
            else bar.classList.replace('bg-red-500', 'bg-red-500');

            if (taTimeLeft <= 0) {
                failTimeAttack();
            }
        }, 1000);
    }

    function stopTimer() {
        if(taTimerInterval) clearInterval(taTimerInterval);
    }

    function renderTimeAttackQuestion() {
        const qData = taQuestions[taCurrentQIndex];
        const container = document.getElementById('blockContainer');
        const feedbackSec = document.getElementById('feedbackSection');
        feedbackSec.classList.add('hidden');
        
        document.getElementById('gameHearts').innerText = taCombo;

        container.innerHTML = '';
        const title = document.createElement('h2');
        title.className = "text-2xl font-bold text-gray-700 mb-8 text-center";
        title.innerText = `'${qData.item.q}'의 뜻은?`;
        container.appendChild(title);

        const grid = document.createElement('div');
        grid.className = "grid grid-cols-1 gap-3 w-full max-w-sm";
        
        qData.choices.forEach(txt => {
            const btn = document.createElement('button');
            btn.className = "w-full border-2 border-gray-200 bg-white hover:bg-gray-50 py-4 rounded-xl text-lg font-bold text-gray-700 shadow-sm active:translate-y-1 transition-all";
            btn.innerText = txt;
            btn.onclick = () => checkTimeAttackAnswer(txt === qData.item.m, qData.item.q);
            grid.appendChild(btn);
        });
        container.appendChild(grid);
        
        document.getElementById('actionArea').classList.add('hidden');
    }

    function checkTimeAttackAnswer(isCorrect, idiomStr) {
        if(isCorrect) {
            let bonus = 3;
            if(taCombo >= 2) bonus += 1; 
            if(taCombo >= 5) bonus += 2;
            
            taTimeLeft = Math.min(60, taTimeLeft + bonus);
            taCombo++;
            showComboEffect(bonus);
        } else {
            taTimeLeft -= 5;
            taCombo = 0;
            shakeScreen();
            trackWrongIdiom(idiomStr);
        }

        document.getElementById('gameHearts').innerText = taCombo;

        taCurrentQIndex++;
        if(taCurrentQIndex >= taTotalQ) {
            winTimeAttack();
        } else {
            renderTimeAttackQuestion();
        }
    }

    // --- CHECK LOGIC & DICTIONARY TRACKING ---
    function trackWrongIdiom(idiomStr) {
        if (idiomStr && !gameData.wrongIdioms.includes(idiomStr)) {
            gameData.wrongIdioms.push(idiomStr);
            saveGame();
        }
    }

    function checkAnswer(id, correctIds, block) { 
        const isCorrect = correctIds.includes(id);
        if(!isCorrect) trackWrongIdiom(currentLesson.title);
        processResult(isCorrect, block); 
    }
    
    function checkSentence(seq, correctSeq, block) { 
        const isCorrect = JSON.stringify(seq)===JSON.stringify(correctSeq);
        if(!isCorrect) trackWrongIdiom(currentLesson.title);
        processResult(isCorrect, block); 
    }

    function processResult(isCorrect, block) {
        const fb = isCorrect ? block.feedback.correct : block.feedback.incorrect;
        showFeedback(isCorrect, fb);
        const btn = document.getElementById('mainActionBtn');
        if(isCorrect) { btn.innerText="계속하기"; btn.onclick=()=>nextBlock(); }
        else {
            gameData.hearts--; document.getElementById('gameHearts').innerText=gameData.hearts; saveGame();
            if(gameData.hearts<=0) { alert("하트 부족! 홈으로 이동합니다."); exitGame(); }
            btn.innerText="계속하기"; btn.className="w-full py-4 rounded-2xl text-xl font-bold text-white shadow-[0_4px_0_#991b1b] bg-red-500 hover:bg-red-600"; btn.onclick=()=>nextBlock();
        }
    }

    // --- DICTIONARY UI ---
    function openDictionary() {
        document.getElementById('mapView').classList.add('hidden');
        document.getElementById('dictView').classList.remove('hidden');
        renderDictionary();
    }
    function closeDictionary() {
        document.getElementById('dictView').classList.add('hidden');
        document.getElementById('mapView').classList.remove('hidden');
    }
    function renderDictionary() {
        const container = document.getElementById('dictContent');
        container.innerHTML = '';
        
        let learned = [];
        gameData.completedLessons.forEach(l_id => {
            for(let lvl of gameData.levels) {
                let match = lvl.lessons.find(ls => ls.lesson_id === l_id);
                if(match && match.type !== 'checkpoint' && !learned.includes(match.title)) {
                    learned.push(match.title);
                }
            }
        });

        if(learned.length === 0) {
            container.innerHTML = `<div class="text-center text-gray-400 mt-20 text-lg">아직 수집한 관용어가 없어요.<br>탐험을 시작해 보세요!</div>`;
            return;
        }

        learned.forEach(idiomStr => {
            const data = GLOBAL_IDIOM_POOL[idiomStr];
            if(!data) return;
            
            const isWrong = gameData.wrongIdioms.includes(idiomStr);
            
            const card = document.createElement('div');
            card.className = `bg-white p-5 rounded-2xl border-2 shadow-sm relative ${isWrong ? 'border-red-200' : 'border-gray-100'}`;
            
            let badge = '';
            if (isWrong) {
                badge = `<div class="absolute -top-3 -right-2 bg-red-500 text-white text-xs font-bold px-3 py-1 rounded-full shadow-md animate-bounce">⚠️ 복습 필요</div>`;
            }

            card.innerHTML = `
                ${badge}
                <h3 class="text-2xl font-bold text-blue-600 mb-1">${idiomStr}</h3>
                <p class="text-gray-700 font-medium mb-3">${data.m}</p>
                <div class="bg-gray-50 p-3 rounded-xl text-gray-500 text-sm font-hand leading-relaxed">
                    "${data.ex}"
                </div>
            `;
            container.appendChild(card);
        });
    }

    // UI Helpers
    function enableMainBtn(text, cb) {
        const btn = document.getElementById('mainActionBtn');
        btn.innerText = text || "확인";
        btn.className = "w-full py-4 rounded-2xl text-xl font-bold text-white shadow-[0_4px_0_#15803d] bg-green-500 hover:bg-green-600 cursor-pointer";
        btn.onclick = cb;
        btn.style.pointerEvents = "auto";
    }
    function renderMCQ(container, choices, cb) {
        const grid = document.createElement('div'); grid.className = "grid grid-cols-1 gap-3 w-full max-w-sm";
        choices.forEach(c => {
            const btn = document.createElement('button');
            btn.className = "option-btn w-full border-2 border-gray-200 bg-white hover:bg-gray-50 py-4 rounded-xl text-lg font-bold text-gray-700 shadow-sm active:translate-y-1 transition-all";
            btn.innerText = c.text;
            btn.onclick = () => {
                document.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('border-blue-500','bg-blue-50','text-blue-600'));
                btn.classList.add('border-blue-500','bg-blue-50','text-blue-600');
                enableMainBtn(null, () => cb(c.id));
            };
            grid.appendChild(btn);
        });
        container.appendChild(grid);
    }
    function renderTF(container, cb) { 
        const flex = document.createElement('div'); flex.className="flex space-x-4 w-full justify-center";
        [{id:'t',t:'O'},{id:'f',t:'X'}].forEach(o=>{
            const b = document.createElement('button'); b.innerText=o.t;
            b.className="tf-btn w-32 h-32 rounded-2xl border-4 border-gray-200 text-6xl font-black text-gray-300 bg-white transition-all";
            b.onclick=()=>{ 
                document.querySelectorAll('.tf-btn').forEach(x=>x.classList.remove('border-blue-500'));
                b.classList.add('border-blue-500'); enableMainBtn(null, ()=>cb(o.id));
            };
            flex.appendChild(b);
        });
        container.appendChild(flex);
    }
    function renderSB(container, tokens, cb) {
        const ans = document.createElement('div'); ans.className="w-full min-h-[60px] border-b-2 border-gray-300 mb-8 flex flex-wrap gap-2 justify-center pb-2";
        const pool = document.createElement('div'); pool.className="flex flex-wrap gap-2 justify-center";
        let seq = [];
        tokens.forEach(t => {
            const b = document.createElement('button'); b.className="word-token"; b.innerText=t;
            b.onclick=()=>{
                if(b.parentElement===pool) { ans.appendChild(b); seq.push(t); }
                else { pool.appendChild(b); seq = seq.filter(x=>x!==t); }
                if(seq.length>0) enableMainBtn(null, ()=>cb(seq)); else disableMainBtn();
            };
            pool.appendChild(b);
        });
        container.appendChild(ans); container.appendChild(pool);
    }
    function disableMainBtn() { 
        const b=document.getElementById('mainActionBtn'); b.className="w-full py-4 rounded-2xl text-xl font-bold text-white shadow-none bg-gray-300 pointer-events-none"; b.onclick=null; 
    }
    function showFeedback(isCorrect, text) {
        const sec=document.getElementById('feedbackSection'); sec.classList.remove('hidden');
        document.getElementById('feedbackText').innerText = text;
        document.getElementById('feedbackTitle').innerText = isCorrect ? "정답! 🎉" : "아쉬워요!";
        document.getElementById('feedbackIcon').innerText = isCorrect ? "✅" : "❌";
        sec.className = `mb-4 p-4 rounded-xl flex items-start space-x-3 animate-slide-in ${isCorrect?'bg-green-100 text-green-800':'bg-red-100 text-red-800'}`;
    }
    function showComboEffect(bonus) {
        const overlay = document.getElementById('comboOverlay');
        const text = document.getElementById('comboText');
        const sub = document.getElementById('timeBonusText');
        if(taCombo > 1) {
            text.innerText = `Combo x${taCombo}!`; sub.innerText = `+${bonus}초`;
            overlay.classList.remove('hidden'); overlay.classList.remove('combo-effect');
            void overlay.offsetWidth; overlay.classList.add('combo-effect');
            setTimeout(() => overlay.classList.add('hidden'), 800);
        }
    }
    function shakeScreen() {
        const view = document.getElementById('gameView'); view.classList.add('animate-shake');
        setTimeout(() => view.classList.remove('animate-shake'), 500);
    }
    function winTimeAttack() {
        stopTimer(); document.getElementById('actionArea').classList.remove('hidden'); finishLesson(true);
    }
    function failTimeAttack() {
        stopTimer(); document.getElementById('failModal').classList.remove('hidden');
    }
    function retryTimeAttack() {
        document.getElementById('failModal').classList.add('hidden');
        initTimeAttack(currentLesson.levelObj, currentLesson); 
        startLesson(currentLesson.levelObj, currentLesson); 
    }
    function nextBlock() {
        currentBlockIndex++;
        if(currentBlockIndex < currentLesson.blocks.length) renderCurrentBlock();
        else finishLesson();
    }
    function finishLesson(isTA=false) {
        let isCave = currentLesson.levelObj && currentLesson.levelObj.type === 'cave';
        if(!gameData.completedLessons.includes(currentLesson.lesson_id)) {
            gameData.completedLessons.push(currentLesson.lesson_id);
            gameData.xp += (isCave ? 100 : (isTA ? 50 : 20)); 
        }
        saveGame();
        document.getElementById('modalTitle').innerText = isCave ? "전설의 동굴 통과!" : (isTA ? "타임어택 성공!" : "레슨 완료!");
        document.getElementById('modalXP').innerText = `+${isCave ? 100 : (isTA ? 50 : 20)}`;
        document.getElementById('completeModal').classList.remove('hidden');
    }
    function closeCompleteModal() {
        document.getElementById('completeModal').classList.add('hidden'); exitGame();
    }
    const oldStartLesson = startLesson;
    startLesson = function(level, lesson, lIdx) {
        lesson.levelObj = level; oldStartLesson(level, lesson, lIdx);
    }

    initGame();
</script>
